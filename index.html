<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="./css/style.css">
    <title>std crud-6</title>
</head>

<body>
    <section>
        <h1 class="bg-danger text-black text-center">std crud-6</h1>
        <div class="container mt-5">
            <div class="row">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <form id="stdForm">
                                <h3 class="bg-primary text-black text-center">STUDENT FORM..!!</h3>
                                <div class="form-group">
                                    <label for="fname">fname</label>
                                    <input type="text" class="form-control" id="fname" required placeholder="">
                                </div>
                                <div class="form-group">
                                    <label for="lname">lname</label>
                                    <input type="text" class="form-control" id="lname" required placeholder="">
                                </div>
                                <div class="form-group">
                                    <label for="rollNO">rollNO</label>
                                    <input type="text" class="form-control" id="rollNO" required placeholder="">
                                </div>
                                <div class="form-group">
                                    <label for="JOB">JOB</label>
                                    <input type="text" class="form-control" id="JOB" required placeholder="">
                                </div>
                                <div class="form-group">
                                    <label for="salary">salary</label>
                                    <input type="text" class="form-control" id="salary" required placeholder="">
                                </div>
                                <button id="addstdBtn" type="submit" class=" btn btn-primary btn-block btn-sm">Add
                                    student</button>
                                <button id="UpdatestdBtn" type="button"
                                    class=" btn btn-danger btn-block btn-sm d-none">Update student</button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-body table-responsive">
                            <h3 class="bg-primary text-black text-center">student information..!!</h3>
                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th>SR.NO</th>
                                        <th>FNAME</th>
                                        <th>LNAME</th>
                                        <th>ROLL.NO</th>
                                        <th>JOB</th>
                                        <th>SALARY</th>
                                        <th>EDIT</th>
                                        <th>DELETE</th>
                                    </tr>
                                </thead>
                                <tbody id="stdcontainer">
                                    <!-- <tr>
                                <td>1</td>
                                <td>shubham</td>
                                <td>dubukwad</td>
                                <td>25</td>
                                <td>web-developer</td>
                                <td>65000</td>  
                                <td>EDIT</td>      
                                <td>REMOVE</td>
                            </tr> -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
